version: '3'
services:
  app:
    image: python:3.11-slim
    container_name: ccback-dev
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      - RAILWAY_ENVIRONMENT=
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    command: >
      bash -c "pip install -r requirements.txt &&
               python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
